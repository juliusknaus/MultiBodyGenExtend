env_name: dex_gripper_holding
benchmark: true  # run in control-only benchmark mode
agent_specs:
  batch_design: true
# training parameters
gamma: 0.995
tau: 0.95
policy_specs:
  control_log_std: -0.5

robot_param_scale: 1
skel_transform_nsteps: 5

done_condition:
  max_ang: 60


obs_specs:
  attr: ['depth']
  sim: []
  design: true
  clip_qvel: true
  use_projected_params: true
  use_body_ind: true
max_body_depth: 4

add_body_condition:
  max_nchild: 2

robot:
  param_mapping: sin
  no_root_offset: true
  
  body_params:
    offset:
      type: 'xy'
      lb: [-0.5, -0.5]
      ub: [0.5, 0.5]

  joint_params: {}

  geom_params:
    #size:
    #  lb: 0.03
    #  ub: 0.10
    size:
      lb: [0.03, 0.03, 0.03]
      ub: [0.10, 0.10, 0.10]
    ellipsoid_radius:
      lb: [0.20, 0.20, 0.15]
      ub: [0.35, 0.35, 0.25]
    ext_start:
      lb: 0.0
      ub: 0.2

  actuator_params:
    gear:
      lb: 20
      ub: 400
  

task_specs:
  #if task is moving
  #mov_goal: False
  #box_pos: [5.0, 0.0, 0.5]
  #if task is lifting
  #box_pos: [2.0, 0.0, 0.7]
  obj_name: 'box'
  #obj_name: 'sphere'
  #obj_name: 'cylinder'
  #obj_name: 'capsule'
  #obj_name: 'prism'
  #obj_name: 'cup'
  box_pos: [0.0, 0.0, 1.0]
  box_random_margin: 0.02
  # Optional explicit spawn bounds [x_min, x_max, y_min, y_max].
  # If omitted, bounds are inferred from wall geoms.
  # box_spawn_range: [-7.0, 7.0, -4.0, 4.0]
  box_cont_cost: False
  reward_type: 'zheight'
  
  # Andrychowitz et al. 2019: Orientation-based reward
  # If true, sample a new random goal quaternion at reset and after each success.
  random_goal_orientation: true
  # Fallback static goal quaternion [w, x, y, z] when random_goal_orientation=False.
  goal_orientation: [0.70710678, 0.0, 0.0, 0.70710678]
  # Goal reached threshold in radians (paper-style value: 0.4).
  orientation_success_threshold: 0.4
  # Reward bonus when goal reached.
  orientation_success_bonus: 20.0
  # Penalty when object is dropped.
  drop_penalty: 5.0
  # Near-floor margin for drop detection.
  drop_height_margin: 0.005
  
  # Legacy weights (kept for backwards compatibility, not used in Andrychowitz reward)
  weights: 
    #contact: 1.0
    distance: 0.1
    #distance: 0.5
    grasp: 1.0
    #grasp: 2.0
    compactness: 1.0
    #compactness: 2.0
    binary: 1.0
    #binary: 2.0
    force_closure: 0.5
    force_magnitude: 0.1
    lift: 5.0
    orientation: 1.0
    #lift: 1.0

