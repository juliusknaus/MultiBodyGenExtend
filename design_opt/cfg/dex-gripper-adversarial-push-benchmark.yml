env_name: dex_gripper_adversarial_push
benchmark: true
agent_specs:
  batch_design: true
# training parameters
gamma: 0.995
tau: 0.95
policy_specs:
  control_log_std: -0.5

robot_param_scale: 1
skel_transform_nsteps: 5

done_condition:
  max_ang: 60

obs_specs:
  attr: ['depth']
  sim: []
  design: true
  clip_qvel: true
  use_projected_params: true
  use_body_ind: true
max_body_depth: 4

add_body_condition:
  max_nchild: 2

robot:
  param_mapping: sin
  no_root_offset: true
  
  body_params:
    offset:
      type: 'xy'
      lb: [-0.5, -0.5]
      ub: [0.5, 0.5]

  joint_params: {}

  geom_params:
    size:
      lb: 0.03
      ub: 0.10
    ext_start:
      lb: 0.0
      ub: 0.2

  actuator_params:
    gear:
      lb: 20
      ub: 400
  

task_specs:
  #if task is moving
  #mov_goal: False
  #box_pos: [5.0, 0.0, 0.5]
  #if task is lifting
  #box_pos: [2.0, 0.0, 0.7]
  box_pos: [0.0, 0.0, 0.7]
  root_init_z: 1.5
  box_cont_cost: False
  random_boxes_pos: true
  reward_type: 'zheight'

  weights: 
    #contact: 1.0
    distance: 0.1
    #distance: 0.5
    grasp: 1.0
    #grasp: 2.0
    compactness: 1.0
    #compactness: 2.0
    binary: 1.0
    #binary: 2.0
    force_closure: 0.5
    force_magnitude: 0.1
    lift: 5.0
    orientation: 1.0
    #lift: 1.0


